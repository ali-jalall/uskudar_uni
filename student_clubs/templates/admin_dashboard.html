{% include "admin_navbar.html"%} {%load static%} {%block content%}
<div class="dashboard-card">
  <h3>Total Members</h3>
  <span class="number">{{total_users}}</span>
  <i class="fas fa-user-plus"></i>
</div>

<!-- Kart 3 -->
<div class="dashboard-card">
  <h3>Total Events</h3>
  <span class="number">{{total_events}}</span>
  <i class="fas fa-calendar-check"></i>
</div>

<!-- Tablo bölümü -->
<div class="table-container">
  <table class="table">
    <thead>
      <tr>
        <th scope="col">Event</th>
        <th scope="col">Type</th>
        <th scope="col">time</th>
        <th scope="col">State</th>
      </tr>
    </thead>
    <tbody>
      {% for event in events %}
      <tr>
        <td>{{ event.event_name }}</td>
        <td>{{event.event_type}}</td>
        <td>{{event.event_date}}</td>
        <td>
          <button
            type="button"
            class="btn btn-primary edit-btn"
            data-id="{{ event.pk }}"
            data-name="{{ event.event_name }}"
            data-type="{{ event.event_type }}"
          >
            Edit
          </button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="view-more-container">
    <a href="{% url 'admin_activity' %}">
      <button class="btn btn-primary view-more-button">View More</button>
    </a>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="editEventModal" tabindex="-1" style="z-index: 9999">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Event</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal">
          <i class="fa fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="updateEventForm" method="post">
          {% csrf_token %}
          <input type="hidden" id="eventId" name="event_id" />
          <label for="eventName">Event name</label>
          <input type="text" id="modalEventName" name="event_name" />
          <br />
          <label for="eventType">Event type</label>
          <input type="text" id="modalEventType" name="event_type" />
          <br />
          <!-- Add other fields like event_date, event_hall, etc. -->
          <button type="submit" class="btn btn-primary">Update Event</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  var pk, url;
  document.querySelectorAll(".edit-btn").forEach((button) => {
    button.addEventListener("click", function () {
      const eventId = this.getAttribute("data-id");
      const eventName = this.getAttribute("data-name");
      const eventType = this.getAttribute("data-type");

      url = `/update_event/${eventId}/`; // Adjust as per your route

      // Set modal fields
      document.getElementById("eventId").value = eventId;
      document.getElementById("modalEventName").value = eventName;
      document.getElementById("modalEventType").value = eventType;

      // Show the modal
      const modal = new bootstrap.Modal(
        document.getElementById("editEventModal")
      );
      modal.show();
    });
  });

  document
    .getElementById("updateEventForm")
    .addEventListener("submit", function (e) {
      e.preventDefault();
      e.stopPropagation();
      const formData = new FormData(this);

      fetch(url, {
        method: "POST",
        body: formData,
        headers: {
          "X-Requested-With": "XMLHttpRequest",
        },
      }).then((response) => {
        location.reload(); // Reload or update the page content dynamically.
      });
    });

  document.querySelector(".btn-close").addEventListener("click", () => {
    // After your form submission or any other action, you can close the modal like this:
    const modal = new bootstrap.Modal(
      document.getElementById("editEventModal")
    );
    modal.hide(); // Close the modal
  });
</script>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

{%endblock%}
