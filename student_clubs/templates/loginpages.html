<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USKUDAR UNIVERSITY</title>
<style>
  body, html {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #2a5298, #1e3c72);
    color: white;
  }
  .wrapper {
    display: flex;
    width: 100%;
    height: 100vh;
    box-sizing: border-box;
  }
  .logo-container {
    width: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .button-container {
    width: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .button {
    background-color: #38bdf8;
    color: white;
    padding: 15px 60px;
    margin: 10px 0;
    border: none;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color 0.3s;
    width: 80%;
    max-width: 300px;
    font-weight: bold;
  }
  .button:hover {
    background-color: #0ea5e9;
  }

  /* Modal styles */
  .modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.4);
    padding-top: 60px;
  }
  .modal-content {
    background: rgba(255, 255, 255, 0.9);
    margin: 15% auto;
    padding: 20px;
    border-radius: 15px;
    width: 30%;
    min-width: 300px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    color: #1e3a8a;
  }
  .close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
  }
  .close:hover,
  .close:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
  }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    display: inline-block;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
  }
  .login-btn {
    width: 100%;
    background-color: #38bdf8;
    color: white;
    padding: 14px 20px;
    margin: 10px 0;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  .login-btn:hover {
    background-color: #0ea5e9;
  }
  .modal-header {
    font-size: 24px;
    margin-bottom: 20px;
  }
  .modal-footer {
    margin-top: 20px;
    text-align: center;
  }
  .modal-footer a {
    text-decoration: none;
    color: #38bdf8;
  }
  .modal-footer a:hover {
    color: #0ea5e9;
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="wrapper">
    <div class="logo-container">
      <img src="/static/images/uskudar_uni_logo.png" alt="USKUDAR UNIVERSITY" style="max-width: 80%; height: auto;">
    </div>
    <div class="button-container">
      <h1>Welcome To Uskudar University<br>Student Clubs</h1>
      <button class="button" onclick="showModal('studentModal')">Student</button>
      <button class="button" onclick="showModal('adminModal')">SKS ADMIN</button>
      <button class="button" onclick="showModal('managerModal')">Club Manager</button>
    </div>
  </div>
  
  <!-- Student Modal -->
  <div id="studentModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="hideModal('studentModal')">&times;</span>
      <div class="modal-header">Login for Students</div>
      <input type="text" id="studentUsername" placeholder="Enter Email" name="email" required>
      <input type="password" id="studentPassword" placeholder="Enter Password" name="password" required>
      <button class="login-btn" onclick="login('student')">Login</button>
      <div class="modal-footer">
        <a href="register.html">Register</a> | <a href="forgot-password.html">Forgot Password?</a>
      </div>
    </div>
  </div>
  
  <!-- Admin Modal -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="hideModal('adminModal')">&times;</span>
      <div class="modal-header">Login for SKS Admin</div>
      <input type="text" id="adminUsername" placeholder="Enter Email" name="email" required>
      <input type="password" id="adminPassword" placeholder="Enter Password" name="password" required>
      <button class="login-btn" onclick="login('admin')">Login</button>
    </div>
  </div>
  
  <!-- Club Manager Modal -->
  <div id="managerModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="hideModal('managerModal')">&times;</span>
      <div class="modal-header">Login for Club Manager</div>
      <input type="text" id="managerUsername" placeholder="Enter Email" name="email" required>
      <input type="password" id="managerPassword" placeholder="Enter Password" name="password" required>
      <button class="login-btn" onclick="login('manager')">Login</button>
    </div>
  </div>

  <script>
  function showModal(modalId) {
    document.getElementById(modalId).style.display = 'block';
  }
  
  function hideModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
  }
  
  function login(userType) {
    var username = document.getElementById(userType + 'Username').value;
    var password = document.getElementById(userType + 'Password').value;
    if (username !== '' && password !== '') {
      var page = '';
      if (userType === 'student') {
        page = 'student_home.html';
      } else if (userType === 'admin') {
        page = 'admin_dashboard.html';
      } else if (userType === 'manager') {
        page = 'manager_dashboard.html';
      }
      window.location.href = page;
    } else {
      alert('Please enter username and password.');
    }
  }

  window.onclick = function(event) {
    if (event.target.classList.contains('modal')) {
      event.target.style.display = "none";
    }
  }
  </script>
</body>
</html>
