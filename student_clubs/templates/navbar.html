{%load static%}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://getbootstrap.com/docs/5.3/assets/css/docs.css"
      rel="stylesheet"
    />
    <title>Bootstrap Example</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      .navbar-brand img {
        height: 40px; /* Logo yüksekliği */
        width: auto; /* Oranını koruyarak genişlik */
        margin-right: 10px; /* Metin ve logo arasındaki boşluk */
      }
    </style>
  </head>
  <body class="p-3 m-0 border-0 bd-example m-0 border-0">
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="student_home.html">
          <img src="/static/images/uskudar_uni_logo.png" alt="Logo" /> Uskudar
          University
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link"
                aria-current="page"
                href="{%url 'StudentDashboard'%}"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{%url 'student_event' %}">Events </a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link"
                aria-current="page"
                href="{%url 'student_clubs' %}"
                >Clubs</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="{%url 'about'%}"
                >About Us</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="{%url 'student_profile'%}"
                >Profile</a
              >
            </li>
            <!-- <li class="nav-item">
              <a class="nav-link" aria-current="page" href="{% url 'logout' %}">Logout</a>
            </li> -->
            <form
              action="{% url 'logout' %}"
              method="post"
              style="display: inline"
            >
              {% csrf_token %}
              <button type="submit" class="btn btn-link nav-link">
                Logout
              </button>
            </form>
          </ul>
        </div>
      </div>
    </nav>
  </body>
</html>
