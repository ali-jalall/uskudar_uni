{%extends "manager_navbar.html"%}

{%block content%}

<style>
  .dashboard-container {
    display: flex;
    justify-content: flex-start; /* Kartları sola yasla */
    flex-wrap: wrap;
    margin-top: 100px; /* Navbar yüksekliği ve ekstra boşluk */
    margin-left: 150px; /* Kartları biraz daha sağa kaydır */
  }
  .main-content {
    margin-top: 100px; /* NavBar yüksekliği + istediğiniz ek boşluk */
    margin-left: 300px; /* SideBar genişliğini artırarak kartları sağa kaydır */
    padding: 20px;
  }
  /* Ana içerik kartları için stil */
  .dashboard-card {
    background-color: #ffffff;
    border-radius: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    margin: 20px;
  }

  .dashboard-card h3 {
    color: #24305E;
    margin-bottom: 10px;
  }

  .dashboard-card .number {
    color: #24305E;
    font-size: 36px;
    font-weight: bold;
  }

  .dashboard-card i {
    color: #24305E;
    margin: 10px;
  }

  .dashboard-container {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    margin-top: 20px; /* Navbar yüksekliği ve ekstra boşluk */
    
  }
/* Tablo ve buton stilleri */
.event-table-container {
  margin-top: 100px; /* NavBar yüksekliği + istediğiniz ek boşluk */
  margin-left: 300px; /* SideBar genişliğini artırarak kartları sağa kaydır */
  padding: 20px;
}

.event-table {
width: 100%;
border-collapse: collapse;
}

.event-table th, .event-table td {
padding: 8px;
text-align: left;
border-bottom: 1px solid #ddd;
}

.btn {
border: 1px solid #ccc;
background-color: white;
padding: 8px 16px;
border-radius: 4px;
cursor: pointer;
font-size: 14px;
transition: background-color 0.2s ease-in-out;
}

.edit-button {
color: #007bff;
border-color: #007bff;
}

.edit-button:hover {
background-color: #007bff;
color: white;
}

/* Modal stilleri */
.modal {
display: none; 
position: fixed; 
z-index: 1; 
left: 0;
top: 0;
width: 100%; 
height: 100%; 
overflow: auto; 
background-color: rgb(0,0,0,0.4); 
}

.modal-content {
background-color: #fefefe;
margin: 15% auto; 
padding: 20px;
border: 1px solid #888;
width: 50%; 
}

.close {
color: #aaa;
float: right;
font-size: 28px;
font-weight: bold;
}

.close:hover,
.close:focus {
color: black;
text-decoration: none;
cursor: pointer;
}

/* Form stilleri */
.form-group {
margin-bottom: 10px;
}

label {
display: block;
margin-bottom: 5px;
}

input[type=text],
input[type=date],
textarea,
select {
width: 100%;
padding: 12px;
margin: 5px 0 20px 0;
display: inline-block;
border: 1px solid #ccc;
border-radius: 4px;
box-sizing: border-box;
}

input[type=submit], .btn.create {
background-color: #4CAF50;
color: white;
padding: 14px 20px;
border: none;
border-radius: 4px;
cursor: pointer;
float: right;
}

input[type=submit]:hover, .btn.create:hover {
background-color: #45a049;
}


</style>
    
    <div class="dashboard-container">
        <!-- Kart 1 -->
        <div class="dashboard-card">
          <h3>Total Clubs</h3>
          <span class="number">{{total_clubs}}</span>
          <i class="fas fa-users"></i>
        </div>
    
        <!-- Kart 2 -->
        <div class="dashboard-card">
          <h3>Total Members</h3>
          <span class="number">{{total_users}}</span>
          <i class="fas fa-user-plus"></i>
        </div>
      </div>

<!-- Edit butonları bulunan tablo -->
<div class="event-table-container">
    <table class="event-table">
      <thead>
        <tr>
          <th>Event</th>
          <th>Time</th>
          <th>State</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Örnek veriler, gerçek uygulamada dinamik olmalı -->
        {% for event in events %}
        <tr>
          <td>{{ event.event_name }}</td>
          <td>{{event.event_date|date:"d-m-20y"}}</td>
          <td><span class="state accepted">Accepted</span></td>
          <td><button type="button" class="btn btn-primary"><a href="{%url 'update_event' pk=event.pk%}" style="text-decoration:none;color:black;">Edit</a></button>
          </td>
        </tr>
        {% endfor %}
        <!-- Diğer satırlar -->
      </tbody>
    </table>
  </div>
  
  <!-- Modal yapı -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Edit Event</h2>
      <!-- Modal form içeriği burada olacak -->
      <!-- ... -->
    </div>
  </div>
  
  

<script>

// Edit butonuna tıklandığında modal açma
function openEditModal(eventId) {
  // Etkinlik verilerini bul
  var event = eventsData.find(e => e.id === eventId);
  if (event) {
    // Form alanlarını etkinlik verileriyle doldur
    document.getElementById('eventName').value = event.name;
    document.getElementById('eventDate').value = event.time;
    // ... Diğer alanlar ...

    // Modalı göster
    var modal = document.getElementById('editModal');
  modal.style.display = 'block';
  } else {
    console.error('Etkinlik bulunamadı!');
  }
}

// Modal kapatma işlevleri
var modal = document.getElementById('editEventModal');
var closeButton = document.getElementsByClassName("close")[0];
closeButton.onclick = function() {
  modal.style.display = "none";
}
window.onclick = function(event) {
  if (event.target == modal) {
    modal.style.display = "none";
  }
}

// Edit Event Modal'ı kapatma işlevi
function closeModal() {
  document.getElementById('editEventModal').style.display = 'none';
}


</script>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>


  {%endblock%}
