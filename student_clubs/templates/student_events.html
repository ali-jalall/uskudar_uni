{% include 'navbar.html' %}


{%block content%}
<style>
    .dashboard-container {
      display: flex;
      justify-content: flex-start; /* Kartları sola yasla */
      flex-wrap: wrap;
      margin-top: 100px; /* Navbar yüksekliği ve ekstra boşluk */
      margin-left: 150px; /* Kartları biraz daha sağa kaydır */
    }
    .main-content {
      margin-top: 100px; /* NavBar yüksekliği + istediğiniz ek boşluk */
      margin-left: 300px; /* SideBar genişliğini artırarak kartları sağa kaydır */
      padding: 20px;
    }
    /* Ana içerik kartları için stil */
    .dashboard-card {
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 20px;
    }

    .dashboard-card h3 {
      color: #24305E;
      margin-bottom: 10px;
    }

    .dashboard-card .number {
      color: #24305E;
      font-size: 36px;
      font-weight: bold;
    }

    .dashboard-card i {
      color: #24305E;
      margin: 10px;
    }

    .dashboard-container {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      margin-top: 20px; /* Navbar yüksekliği ve ekstra boşluk */
      
    }
    .event-table-container {
        margin-top: 100px; /* NavBar yüksekliği + istediğiniz ek boşluk */
      margin-left: 300px; /* SideBar genişliğini artırarak kartları sağa kaydır */
      padding: 20px;
  font-family: Arial, sans-serif;
}

.event-table {
  width: 100%;
  border-collapse: collapse;
}

.event-table th,
.event-table td {
  text-align: left;
  padding: 8px;
  border-bottom: 1px solid #ddd;
}

.event-table thead {
  background-color: #f2f2f2;
}

.state {
  padding: 5px 10px;
  color: white;
  text-transform: uppercase;
  font-weight: bold;
  border-radius: 4px;
  text-align: center;
  display: inline-block;
 
}

.pending {
  background-color: #f0ad4e; /* Oranj rengi arka plan */
}

.accepted {
  background-color: #5cb85c; /* Yeşil arka plan */
}

/* Daha iyi bir görsel ayrım için durumları ortalar */
.event-table td:last-child {
  text-align: center;
}

.event-table-container{
    margin-left:auto;
}


</style>
<div class="event-table-container">
    <table class="event-table">
        <thead>
          <tr>
            <th>Event</th>
            <th>Type</th>
            <th>Time</th>
            <th>State</th>
          </tr>
        </thead>
 <tbody>
{% for event in events %}

<tr>
  <td>{{ event.event_name }}</td>
  <td>{{ event.event_type }}</td>
  <td>{{event.event_date|date:"Y-m-d"}}</td>
  <td><span class="state accepted">Accepted</span></td>
</tr>
</div>
{% endfor %}
</tbody>
</table>
{%endblock%}
