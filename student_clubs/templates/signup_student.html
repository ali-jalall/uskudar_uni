<!DOCTYPE html>
<head>
    <title>sign up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
    <style>
        body{
            background-color: rgb(237, 237, 237);
        }
        .container{
            margin-top:15em;
            width:70%;
            margin-left:20em;
            
        }
        .container label{
            font-weight:bold;
            margin-bottom:1em;
            margin-top:1em;
            display:block;
            margin-left:15%;
        }
        .container button{
            margin-top:3em;
            width:14em;
            height:3em;
            margin-left:40%;
            background-color:#363638;
            font-weight:bold;
            text-transform:uppercase;
            border:none;
        }
        .container button:hover, .container button:active{
            background-color:#000000;
            color:white;
        }
        
        #id_email,#id_fullName ,#id_phone_number , #id_password1 , #id_password2 {
            border:none;
            border:0.1em solid #C1C2AD;
            font-weight:bold;
            width:70%;
            margin-left:15%;
            height:2em;
            border-radius:0.3em;
            
        }
        .errorlist{
            list-style:none;
            margin-left:2em;
            
        }
        ul{
            font-weight:bold;
            display:inline;
           
        }
         ul li ul li {
            font-weight:Normal;
            display:inline; 
        }
        .container h1{
            text-align: center;
        }
    </style>
</head>
<body>
    
    <div class="container" style="width:60%;height:auto; margin-left:20%;">
        <h1>Sign up | Student</h1>
        <form method="POST">
            {%csrf_token%}
            <div class="form-group">
            <label for="fullName">Full Name</label>
            {{ form.fullName }}	
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                {{ form.email }}	
                </div>
            <div class="form-group">
                    <label for="phone_number">Phone Number</label>
                    {{ form.phone_number }}	
                    </div>
            <div class="form-group" >
            <label for="exampleInputPassword1">Password</label>
            {{ form.password1 }}
            <label for="exampleInputPassword1">Re-peat Password</label>
            {{ form.password2 }}	
            </div>
            {%if form.errors%}
                {{form.errors}}
            {%endif%}
                
            <button type="submit" class="btn btn-primary">Sign Up</button>
      </form>
    </div>
</body>
