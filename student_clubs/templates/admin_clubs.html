{%extends "admin_navbar.html"%}
{%load static%}

    

{%block content%}
<style>
  .manage-clubs-container {
    font-family: Arial, sans-serif;
    margin-top: 100px; /* NavBar yüksekliği + istediğiniz ek boşluk */
        margin-left: 300px; /* SideBar genişliğini artırarak kartları sağa kaydır */
        padding: 20px;
  }
  
  .search-and-create {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  
  #searchInput {
    padding: 8px;
    width: 70%;
    margin-right: 10px;
    border: none;
    border-radius: 4px;
  }
  
  #searchInput::placeholder {
    color: #999;
  }
  
  .create-club-button {
    background-color: #5cb85c; /* Yeşil arka plan */
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    color: white;
    cursor: pointer;
  }
  
  .create-club-button:hover {
    background-color: #4cae4c; /* Daha koyu yeşil arka plan */
  }
  
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  
  th, td {
    text-align: left;
    padding: 8px;
    border-bottom: 1px solid #ddd;
  }
  
  .edit-button, .delete-button {
    padding: 4px 8px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-left: 5px;
  }
  
  .edit-button {
    background-color: #0275d8; /* Mavi arka plan */
    color: white;
  }
  
  .delete-button {
    background-color: #d9534f; /* Kırmızı arka plan */
    color: white;
  }
  
  .edit-button:hover {
    background-color: #025aa5; /* Daha koyu mavi arka plan */
  }
  
  .delete-button:hover {
    background-color: #c9302c; /* Daha koyu kırmızı arka plan */
  }
  
      </style>
    <div class="manage-clubs-container">
        <div class="search-and-create">
          <input type="text" id="searchInput" placeholder="Search">
          <button class="create-club-button"> <a style="text-decoration: none; color: white;" href="{%url 'create_club'%}">Create Club</a></button>
        </div>
      
        <table id="clubsTable">
          <thead>
            <tr>
              <th>CN</th>
              <th>Names</th>
              <th>Admin</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            {% for club in clubs %}
              <tr>
                <td>{{club.club_id }}</td>
                <td>{{club.club_name }}</td>
                <td>{{club.club_manager.fullName}}</td>
                <td>{{club.club_status}}</td>
                <td><button type="button" class="btn btn-primary"><a href="{%url 'update_club' pk=club.pk%}" style="text-decoration:none;color:black;">Edit</a></button>
                </td>
              </tr>
        {% endfor %}
          </tbody>
        </table>
      </div>
      <script>
      </script>

  
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="{%static '/js/natification.js' %}"></script>

    {%endblock%}
